# Motion-invariant smoke test — CI gate for the animation pipeline.
#
# Runs `npm run smoke` (tests/smoke-tick.mjs: 12,000 headless frames of the
# real tick pipeline, asserting float/ripple/sweep/dust/LED/pulse bounds,
# zero NaN, reduced-motion staticity, and the raycast layer) on every push
# to master and on every pull request.
#
# Timing decision: the full run takes ~2s locally (measured 2026-08), so it
# is practical on EVERY push — no nightly schedule needed. If the suite ever
# grows beyond ~60s, move this to a nightly cron (`schedule: - cron: '0 3 * * *'`)
# and drop the push/pr triggers, noting that tradeoff here.
name: smoke

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vite 8 requires Node 20.19+ / 22.12+ — pin 22 for the LTS floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the 12,000-frame motion smoke test
        run: npm run smoke
